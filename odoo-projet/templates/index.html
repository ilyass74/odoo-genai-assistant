
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assistant B Tel Bureautique</title>
<style>
  :root {
    --purple: #714B67;
    --purple-dark: #4a2f42;
    --bg: #f4f2f5;
    --text-dark: #2b2530;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--purple);
    color: white;
    padding: 16px 24px;
    font-size: 18px;
    font-weight: 600;
  }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 70%;
    padding: 10px 16px;
    border-radius: 16px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--purple);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: white;
    color: var(--text-dark);
    border: 1px solid #e0dde2;
    border-bottom-left-radius: 4px;
  }
  .msg.bot a { color: inherit; }
  .msg.loading { color: #888; font-style: italic; }
  form {
    display: flex;
    padding: 16px;
    gap: 8px;
    background: white;
    border-top: 1px solid #e0dde2;
  }
  input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 24px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: var(--purple); }
  button {
    background: var(--purple);
    color: white;
    border: none;
    border-radius: 24px;
    padding: 0 24px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { background: var(--purple-dark); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<header>Assistant B Tel Bureautique</header>
<div id="chat"></div>
<form id="form">
  <input id="input" type="text" placeholder="Pose ta question..." autocomplete="off" />
  <button type="submit">Envoyer</button>
</form>
<script>
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");

function addMessage(text, className) {
  const div = document.createElement("div");
  div.className = "msg " + className;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function setBotAnswer(div, text) {
  const escaped = document.createElement("div");
  escaped.textContent = text;
  let html = escaped.innerHTML;
  html = html.replace(/\/rapports\/[^\s*<]+/g, function(match) {
    return "<a href=\"" + match + "\" target=\"_blank\">" + match + "</a>";
  });
  div.innerHTML = html;
  chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMessage(question, "user");
  input.value = "";
  input.disabled = true;
  const loadingMsg = addMessage("...", "bot loading");

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question})
    });
    const data = await res.json();
    loadingMsg.classList.remove("loading");
    setBotAnswer(loadingMsg, data.answer);
  } catch (err) {
    loadingMsg.classList.remove("loading");
    setBotAnswer(loadingMsg, "Erreur : impossible de contacter l assistant.");
  }

  input.disabled = false;
  input.focus();
});
</script>
</body>
</html>
